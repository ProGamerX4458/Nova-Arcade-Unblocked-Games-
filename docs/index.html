<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Arcade - Unblocked Games Portal</title>
    <meta name="description" content="A fast, ad-free unblocked games portal featuring playable web games stored via iframes in JSON, category filters, tab cloaking, fullscreen mode, and custom game library management." />
    <meta property="og:title" content="Nova Arcade - Unblocked Games Portal" />
    <meta property="og:description" content="A fast, ad-free unblocked games portal featuring playable web games stored via iframes in JSON, category filters, tab cloaking, fullscreen mode, and custom game library management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/app.css">
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; background: #090d16; color: #38bdf8; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 20px;">
        <div style="font-size: 42px; margin-bottom: 16px;">🎮</div>
        <h1 style="font-size: 22px; font-weight: 800; letter-spacing: 0.05em; color: #f8fafc; margin: 0 0 8px 0;">NOVA ARCADE</h1>
        <p id="portal-status" style="font-size: 13px; color: #94a3b8; margin: 0;">Loading game arcade...</p>
      </div>
    </div>
    <!-- Vite development entry point -->
    <!-- Production static fallback (runs if served directly on GitHub Pages without Vite) -->
    <script>
      setTimeout(function() {
        if (!window.__nova_arcade_mounted__) {
          var status = document.getElementById('portal-status');
          if (status) status.innerText = 'Initializing portal assets...';
          
          var cssLink = document.querySelector('link[href*="app.css"]');
          if (!cssLink) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = './assets/app.css';
            document.head.appendChild(link);
          }

          var script = document.createElement('script');
          script.type = 'module';
          script.src = './assets/app.js';
          document.head.appendChild(script);
        }
      }, 50);
    </script>
  </body>
</html>
