<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      gap: 24px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .stat {
      background: #131c2e;
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-val { color: #38bdf8; font-family: monospace; font-size: 16px; }
    #gameCanvas {
      background: #0b1120;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(56,189,248,0.1);
    }
    .controls {
      margin-top: 14px;
      color: #64748b;
      font-size: 12px;
      text-align: center;
    }
    .touch-controls {
      display: none;
      margin-top: 12px;
      gap: 8px;
    }
    @media (hover: none) and (pointer: coarse) {
      .touch-controls { display: grid; grid-template-columns: repeat(3, 48px); }
    }
    .t-btn {
      width: 48px;
      height: 48px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="stat"><span>SCORE:</span><span id="score" class="stat-val">0</span></div>
    <div class="stat"><span>BEST:</span><span id="highScore" class="stat-val">0</span></div>
  </div>

  <canvas id="gameCanvas" width="440" height="440"></canvas>

  <div class="controls">
    Controls: <kbd>Arrow Keys</kbd> or <kbd>W A S D</kbd> to steer • <kbd>Space</kbd> to restart/pause
  </div>

  <div class="touch-controls">
    <div></div><button class="t-btn" onclick="steer(0,-1)">↑</button><div></div>
    <button class="t-btn" onclick="steer(-1,0)">←</button>
    <button class="t-btn" onclick="steer(0,1)">↓</button>
    <button class="t-btn" onclick="steer(1,0)">→</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
    let food = { x: 15, y: 10 };
    let dx = 0;
    let dy = -1;
    let nextDx = 0;
    let nextDy = -1;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('nexus_snake_best') || '0', 10);
    highScoreEl.textContent = highScore;

    let gameOver = false;
    let isPaused = false;
    let gameLoop = null;

    // Web Audio Sound Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function spawnFood() {
      while (true) {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
        const onSnake = snake.some(seg => seg.x === food.x && seg.y === food.y);
        if (!onSnake) break;
      }
    }

    function steer(newDx, newDy) {
      if (gameOver) { resetGame(); return; }
      if (newDx !== 0 && dx !== 0) return;
      if (newDy !== 0 && dy !== 0) return;
      nextDx = newDx;
      nextDy = newDy;
    }

    window.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': steer(0, -1); break;
        case 'ArrowDown': case 's': case 'S': steer(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': steer(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': steer(1, 0); break;
        case ' ':
          if (gameOver) resetGame();
          else isPaused = !isPaused;
          break;
      }
    });

    function resetGame() {
      snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
      dx = 0; dy = -1;
      nextDx = 0; nextDy = -1;
      score = 0;
      scoreEl.textContent = '0';
      gameOver = false;
      isPaused = false;
      spawnFood();
    }

    function update() {
      if (gameOver || isPaused) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      function triggerGameOver() {
        gameOver = true;
        playBeep(140, 'sawtooth', 0.3);
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'NOVA_SAVE_PROGRESS',
              gameId: 'retro-snake',
              highScore: highScore,
              score: score,
              gameFinished: true
            }, '*');
          }
        } catch (e) {}
      }

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        triggerGameOver();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        triggerGameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('nexus_snake_best', highScore);
        }
        playBeep(620, 'sine', 0.12);
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Clear background
      ctx.fillStyle = '#0b1120';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = '#111c33';
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }

      // Draw food (apple)
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw snake
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#38bdf8' : '#0284c7';
        if (i === 0) {
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 8;
        } else {
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(
          seg.x * gridSize + 1,
          seg.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );
      });
      ctx.shadowBlur = 0;

      // Game over overlay
      if (gameOver) {
        ctx.fillStyle = 'rgba(11, 17, 32, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 26px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px system-ui';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('Press Space or Steer to Restart', canvas.width / 2, canvas.height / 2 + 45);
      } else if (isPaused) {
        ctx.fillStyle = 'rgba(11, 17, 32, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
      }
    }

    spawnFood();
    setInterval(() => {
      update();
      draw();
    }, 95);
  </script>
</body>
</html>
