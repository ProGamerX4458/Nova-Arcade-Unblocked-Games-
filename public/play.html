<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>Nova Arcade</title>
  <link id="tabFavicon" rel="icon" href="/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gameFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }
    #loadingOverlay {
      position: absolute;
      inset: 0;
      background: #090d16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      z-index: 50;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(6, 182, 212, 0.2);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hud {
      position: fixed;
      top: 10px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 100;
      opacity: 0.25;
      transition: opacity 0.2s ease;
    }
    .hud:hover {
      opacity: 1;
    }
    .hud-btn {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(51, 65, 85, 0.8);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .hud-btn:hover {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingTitle" style="font-size: 16px; font-weight: 700; color: #38bdf8; margin-bottom: 4px;">Launching Game...</div>
    <div style="font-size: 12px; color: #64748b;">Nova Arcade Fullscreen Mode</div>
  </div>

  <div class="hud">
    <a href="/" class="hud-btn" title="Back to Nova Arcade">🏠 Arcade</a>
    <button class="hud-btn" id="reloadBtn" title="Reload Game">↻ Reload</button>
    <button class="hud-btn" id="fsBtn" title="Toggle Fullscreen">⛶ Fullscreen</button>
  </div>

  <iframe
    id="gameFrame"
    allow="accelerometer *; autoplay *; camera *; clipboard-read *; clipboard-write *; encrypted-media *; fullscreen *; geolocation *; gyroscope *; local-network-access *; magnetometer *; microphone *; midi *; payment *; picture-in-picture *; screen-wake-lock *; sync-xhr *; usb *; web-share *"
    allowfullscreen="true"
  ></iframe>

  <script>
    // Read game parameters
    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('id') || '';
    const rawUrl = params.get('url') || '';
    const rawTitle = params.get('title') || '';

    // Apply cloaking preset from localStorage if available
    const savedCloak = localStorage.getItem('nexus_tab_cloak') || 'default';
    const PRESETS = {
      default: { title: rawTitle || 'Nova Arcade', icon: '/favicon.ico' },
      classroom: { title: 'Classes', icon: 'https://ssl.gstatic.com/classroom/favicon.png' },
      drive: { title: 'My Drive - Google Drive', icon: 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png' },
      docs: { title: 'Untitled document - Google Docs', icon: 'https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico' },
      canvas: { title: 'Dashboard', icon: 'https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico' },
      wikipedia: { title: 'Wikipedia, the free encyclopedia', icon: 'https://en.wikipedia.org/static/favicon/wikipedia.ico' },
      desmos: { title: 'Desmos | Graphing Calculator', icon: 'https://www.desmos.com/favicon.ico' }
    };

    const preset = PRESETS[savedCloak] || PRESETS.default;
    document.title = (savedCloak !== 'default' ? preset.title : (rawTitle || preset.title));
    const favLink = document.getElementById('tabFavicon');
    if (favLink && preset.icon) favLink.href = preset.icon;

    if (rawTitle) {
      document.getElementById('loadingTitle').innerText = 'Launching ' + rawTitle + '...';
    }

    const frame = document.getElementById('gameFrame');
    const overlay = document.getElementById('loadingOverlay');

    function applyUrl(url) {
      if (!url) return;
      frame.src = url;
    }

    // Function to load the game into the iframe
    function loadGame() {
      if (gameId) {
        fetch('/games.json')
          .then(r => r.json())
          .then(games => {
            const match = games.find(g => g.id === gameId);
            if (match) {
              if (match.title && savedCloak === 'default') {
                document.title = match.title;
                document.getElementById('loadingTitle').innerText = 'Launching ' + match.title + '...';
              }
              applyUrl(match.iframeUrl);
            } else if (rawUrl) {
              applyUrl(rawUrl);
            }
          })
          .catch(() => {
            if (rawUrl) applyUrl(rawUrl);
          });
      } else if (rawUrl) {
        applyUrl(rawUrl);
      }
    }

    let hideTimer = null;
    function hideOverlay() {
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 350);
    }

    frame.addEventListener('load', () => {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hideOverlay, 400);
    });

    // Safety fallback to hide loader after 2.5s in case iframe doesn't fire load event immediately
    hideTimer = setTimeout(hideOverlay, 2500);

    document.getElementById('reloadBtn').addEventListener('click', () => {
      overlay.style.display = 'flex';
      overlay.style.opacity = '1';
      frame.src = frame.src;
      hideTimer = setTimeout(hideOverlay, 2000);
    });

    document.getElementById('fsBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    loadGame();
  </script>
</body>
</html>
